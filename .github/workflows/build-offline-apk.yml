name: Build A.Hamza Traders Offline APK

on:
  push:
    branches: [offline-copy]
    paths:
      - 'android-apk/**'
      - 'index.html'
      - 'manifest.json'
      - 'launchericon-512x512.png'
      - 'welcome-banner.webp'
      - '.github/workflows/build-offline-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout offline copy
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node for Android 8 WebView compatibility
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Transpile app JavaScript for older Android WebView
        run: |
          npm install --no-save @babel/core@7 @babel/cli@7 @babel/preset-env@7
          python3 android-apk/transpile_inline.py

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Package Android 8 compatible app assets
        run: |
          mkdir -p android-apk/app/src/main/assets
          cp android-apk/generated-assets/index.html android-apk/app/src/main/assets/index.html
          cp manifest.json launchericon-512x512.png android-apk/app/src/main/assets/
          if [ -f welcome-banner.webp ]; then cp welcome-banner.webp android-apk/app/src/main/assets/; fi

      - name: Build debug APK
        working-directory: android-apk
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Hamza-Traders-Offline-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
